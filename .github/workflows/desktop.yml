name: ПК-версия
# Сборка запускается изменениями в desktop/**, build.gradle.kts и этом файле.

on:
  push:
    branches: [main]
    paths: ["desktop/**", "android/app/build.gradle.kts", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Один релиз за раз: Android и ПК не перезаписывают файлы друг друга.
concurrency:
  group: ryzikchat-release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (установщик)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зимняя иконка
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_winter_icon.py
      - name: Сборка установщика
        shell: bash
        run: |
          set -o pipefail
          gradle packageExe packageMsi createDistributable --stacktrace 2>&1 | tee gradle.log
      - name: Ошибки сборки
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:' gradle.log | head -9 | sed 's/^/::error::/' || true
          # Подробности jpackage — одной аннотацией (их не больше 10 на шаг).
          log=$(cat build/compose/logs/*/*-err.txt build/compose/logs/*/*-out.txt 2>/dev/null | tail -60)
          log="${log//'%'/'%25'}"; log="${log//$'\r'/}"; log="${log//$'\n'/'%0A'}"
          echo "::error title=jpackage::${log}"
      - name: Файлы для релиза
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          $msi = Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $exe.FullName RyzikChat-Setup.exe
          Copy-Item $msi.FullName RyzikChat-Setup.msi
          Compress-Archive -Path build/compose/binaries/main/app/RyzikChat -DestinationPath RyzikChat-Windows-portable.zip
          Get-ChildItem RyzikChat-*
      - uses: actions/upload-artifact@v4
        with:
          name: RyzikChat-Windows
          path: |
            desktop/RyzikChat-Setup.exe
            desktop/RyzikChat-Setup.msi
            desktop/RyzikChat-Windows-portable.zip

  linux:
    name: Linux (AppImage и .deb)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зимняя иконка
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_winter_icon.py
      - name: Сборка .deb и папки приложения
        run: |
          set -o pipefail
          gradle packageDeb createDistributable --stacktrace 2>&1 | tee gradle.log
      - name: Ошибки сборки
        if: failure()
        run: |
          grep -E '^e: |error:' gradle.log | head -9 | sed 's/^/::error::/' || true
          cat build/compose/logs/*/*-err.txt build/compose/logs/*/*-out.txt 2>/dev/null | tail -60 || true
      - name: AppImage
        run: |
          app=build/compose/binaries/main/app/RyzikChat
          dir=RyzikChat.AppDir
          mkdir -p $dir/usr
          cp -r $app/. $dir/usr/
          cp src/main/resources/icon.png $dir/ryzikchat.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=RyzikChat' 'Comment=RyzikChat messenger' \
            'Exec=RyzikChat' 'Icon=ryzikchat' 'Categories=Network;InstantMessaging;' 'Terminal=false' > $dir/ryzikchat.desktop
          printf '%s\n' '#!/bin/sh' 'here="$(dirname "$(readlink -f "$0")")"' 'exec "$here/usr/bin/RyzikChat" "$@"' > $dir/AppRun
          chmod +x $dir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $dir RyzikChat-x86_64.AppImage
          cp build/compose/binaries/main/deb/*.deb RyzikChat-amd64.deb
          tar -C build/compose/binaries/main/app -czf RyzikChat-Linux-portable.tar.gz RyzikChat
          ls -la RyzikChat-*
      - uses: actions/upload-artifact@v4
        with:
          name: RyzikChat-Linux
          path: |
            desktop/RyzikChat-x86_64.AppImage
            desktop/RyzikChat-amd64.deb
            desktop/RyzikChat-Linux-portable.tar.gz

  release:
    name: Релиз (Windows и Linux)
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RyzikChat-*
          path: release
          merge-multiple: true
      - name: Показать файлы
        run: ls -la release
      - name: Релиз (свежая сборка)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view ryzikchat-latest >/dev/null 2>&1 ||             gh release create ryzikchat-latest --prerelease --title "RyzikChat (свежая сборка)" --notes "Свежая сборка RyzikChat."
          gh release upload ryzikchat-latest release/* --clobber
